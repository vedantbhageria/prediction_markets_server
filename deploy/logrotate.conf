# Keeps ~/logs from growing forever: each log is rotated once it passes 50 MB,
# 10 old copies kept, compressed. copytruncate because every program keeps its
# log open and appends to it. Installed by install-services.sh as
# /etc/logrotate.d/prediction-markets (logrotate runs it daily).
/home/theonealpha/logs/*.log {
    size 50M
    rotate 10
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su theonealpha theonealpha
}
